name: Build Android APK with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions web UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Buildozer Global Directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Prepare Workspace and Cache Permissions
        run: |
          mkdir -p ~/.buildozer
          sudo chmod -R 777 ~/.buildozer
          sudo chmod -R 777 .

      - name: Build APK with Official Kivy Buildozer Image
        run: |
          docker run --rm \
            --volume "${HOME}/.buildozer":/home/user/.buildozer \
            --volume "${PWD}":/home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMSForwarder-debug-apk
          path: bin/*.apk
          retention-days: 14
